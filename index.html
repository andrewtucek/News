<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>whatmore.today</title><style>body{font:17px/1.6 system-ui;margin:0;background:#f5f6f3;color:#24332c}body.dark{background:#17201c;color:#eee}header,article{background:#fff;border-radius:12px;padding:24px}body.dark header,body.dark article{background:#25332c}header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center}strong{font-size:28px}span{color:#419b77}button{font:inherit;padding:8px 14px;border:1px solid #aaa;border-radius:8px;background:transparent;color:inherit;cursor:pointer}nav{display:flex;flex-direction:column;gap:10px;padding:24px}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1200px;margin:auto}main{padding:24px}article{margin:20px 0}a{color:#419b77}h1,h2{line-height:1.2}@media(max-width:650px){.layout{display:block}nav{flex-direction:row;overflow:auto}main{padding:15px}}</style><header><strong>whatmore<span>.today</span></strong><div><button id="lang">Čeština</button> <button id="theme">◐</button></div></header><div class="layout"><nav id="nav"></nav><main><h1 id="title"></h1><p id="tag"></p><div id="news"></div></main></div><script>let l=localStorage.lang||'en',s=0,items=[];const $=x=>document.getElementById(x);document.body.classList.toggle('dark',localStorage.theme==='dark');$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.theme=document.body.classList.contains('dark')?'dark':'light'};$('lang').onclick=()=>{l=l==='en'?'cs':'en';localStorage.lang=l;render()};function render(){document.documentElement.lang=l;let c=l==='cs',n=c?['⌂ Úvodní stránka','🇨🇦 Kanada','🇨🇿 Česko']:['⌂ Home','🇨🇦 Canada','🇨🇿 Czechia'];$('lang').textContent=c?'English':'Čeština';$('title').textContent=n[s];$('tag').textContent=c?'Objevujte něco nového. Každý den.':'Discover something new. Every day.';$('nav').replaceChildren(...n.map((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{s=i;render()};return b}));let gov=document.createElement('button');gov.textContent=c?'🏛 Vláda a volby':'🏛 Government & Elections';gov.onclick=()=>location.href='government.html';$('nav').append(gov);$('news').replaceChildren();for(let a of items.filter(a=>!s||a.region===s)){let e=document.createElement('article');e.id=a.id;let m=document.createElement('small');m.textContent=a.date+' · '+n[a.region];let h=document.createElement('h2');h.textContent=a[l].title;e.append(m,h);for(let t of a[l].body){let p=document.createElement('p');p.textContent=t;e.append(p)}let link=document.createElement('a');link.href=a.source;link.textContent=c?'Zdroj':'Source';let b=document.createElement('button');b.textContent=c?'Sdílet':'Share';b.onclick=async()=>{let url=location.href.split('#')[0]+'#'+a.id;if(navigator.share)await navigator.share({title:h.textContent,url});else await navigator.clipboard.writeText(url)};e.append(link,document.createElement('p'),b);$('news').append(e)}if(!$('news').children.length)$('news').textContent=c?'Zatím žádné články.':'No articles yet.'}render();fetch('articles.json').then(r=>r.json()).then(a=>{items=a;render();if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView()}).catch(()=>{$('news').textContent='News unavailable / Zprávy nejsou dostupné'});</script></html>
