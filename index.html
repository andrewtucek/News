<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>whatmore.today</title><style>body{font:17px/1.6 system-ui;margin:0;background:#f5f6f3;color:#24332c}body.dark{background:#17201c;color:#eee}header,article{background:#fff;border-radius:12px;padding:24px}body.dark header,body.dark article{background:#25332c}header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center}strong{font-size:28px}span{color:#419b77}button{font:inherit;padding:8px 14px;border:1px solid #aaa;border-radius:8px;background:transparent;color:inherit;cursor:pointer}nav{display:flex;flex-direction:column;gap:10px;padding:24px}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1200px;margin:auto}main{padding:24px}article{margin:20px 0}a{color:#419b77}h1,h2{line-height:1.2}@media(max-width:650px){.layout{display:block}nav{flex-direction:row;overflow:auto}main{padding:15px}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}.grid article{margin:0;padding:0;overflow:hidden}.grid a{display:block;color:inherit;text-decoration:none}.grid .copy{padding:18px}.grid h2{font-size:21px;margin:8px 0}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:8px}.grid .photo{border-radius:0}.empty{opacity:.7}.section{margin:32px 0}.credit{font-size:12px;opacity:.75}.placeholder{aspect-ratio:16/9;background:linear-gradient(135deg,#427c68,#a6c3ad);display:grid;place-items:center;color:white;font-size:32px}</style><header><strong>whatmore<span>.today</span></strong><div><button id="lang">Čeština</button> <button id="theme">◐</button></div></header><div class="layout"><nav id="nav"></nav><main><h1 id="title"></h1><p id="tag"></p><div id="news"></div></main></div><script>let l=localStorage.lang||'en',s=0,items=[];const $=x=>document.getElementById(x);document.body.classList.toggle('dark',localStorage.theme==='dark');$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.theme=document.body.classList.contains('dark')?'dark':'light'};$('lang').onclick=()=>{l=l==='en'?'cs':'en';localStorage.lang=l;render()};function node(tag,t){let e=document.createElement(tag);if(t)e.textContent=t;return e}function picture(a){if(!a.image){let e=node('div','▧');e.className='placeholder';e.setAttribute('aria-label',l==='cs'?'Bez fotografie':'No photo available');return e}let e=node('img');e.className='photo';e.src=a.image;e.alt=a[l].title;e.onerror=()=>{let p=node('div','▧');p.className='placeholder';e.replaceWith(p)};return e}function render(){let c=l==='cs',n=c?['⌂ Úvodní stránka','🇨🇦 Kanada','🇨🇿 Česko']:['⌂ Home','🇨🇦 Canada','🇨🇿 Czechia'];document.documentElement.lang=l;$('lang').textContent=c?'English':'Čeština';$('title').textContent=n[s];$('tag').textContent=c?'Objevujte něco nového. Každý den.':'Discover something new. Every day.';$('nav').replaceChildren(...n.map((v,i)=>{let b=node('button',v);b.onclick=()=>{s=i;history.pushState(null,'',location.pathname+location.search);render()};return b}));let gov=node('button',c?'🏛 Vláda a volby':'🏛 Government & Elections');gov.onclick=()=>location.href='government.html';$('nav').append(gov);let root=$('news');root.replaceChildren();let selected=items.find(a=>a.id===decodeURIComponent(location.hash.slice(1)));if(selected){let a=selected,d=a[l];$('title').textContent=n[a.region];let back=node('button',c?'← Zpět na zprávy':'← Back to news');back.onclick=()=>{history.pushState(null,'',location.pathname+location.search);render()};root.append(back);let e=node('article');e.append(node('small',a.date),node('h2',d.title),picture(a));if(a.imageCredit){let cr=node('p',a.imageCredit[l]);cr.className='credit';e.append(cr)}for(let t of d.body)e.append(node('p',t));let link=node('a',c?'Zdroj':'Source');link.href=a.source;let b=node('button',c?'Sdílet':'Share');b.onclick=async()=>{if(navigator.share)await navigator.share({title:d.title,url:location.href});else await navigator.clipboard.writeText(location.href)};e.append(link,node('p'),b);root.append(e);return}for(let region of s?[s]:[1,2]){let sec=node('section');sec.className='section';sec.append(node('h2',n[region]));let grid=node('div');grid.className='grid';let list=items.filter(a=>a.region===region).sort((a,b)=>b.date.localeCompare(a.date));if(!s)list=list.slice(0,6);for(let a of list){let e=node('article'),link=node('a');link.href='#'+a.id;let copy=node('div');copy.className='copy';copy.append(node('small',a.date),node('h2',a[l].title),node('p',a[l].body[0].slice(0,150)+'…'));link.append(picture(a),copy);e.append(link);grid.append(e)}if(!list.length)grid.append(node('p',c?'Zatím žádné články.':'No articles yet.'));sec.append(grid);root.append(sec)}}window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();fetch('articles.json',{cache:'no-cache'}).then(r=>r.json()).then(a=>{items=a;render()}).catch(()=>{$('news').textContent='News unavailable / Zprávy nejsou dostupné'});</script></html>
